<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>

    <link href="https://fonts.googleapis.com/css2?family=Comfortaa&amp;family=Montserrat&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.1/css/all.css">
    <link rel="stylesheet" type="text/css" href="todo-app.css">
    <script type="text/javascript" src="todo-app.js"></script>
</head>

<body onload="renderOlItems()">


    <!-- App Container -->
    <main>
        <div class="container">
            <div class="app-header">
                TO-DO LIST
            </div>
            <div class="input-wrapper">
                <input type="text" id="input-field" onkeydown="onItemAdd(event)" placeholder="Add a new task here...">
            </div>


            <!-- list items -->
            <ol class="list" id="list-items">
            </ol>
        </div>
    </main>

</body>

</html>
