<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Quiz — Level Vừa</title>
  <style>
    :root {
      --bg: #f7f5f1;
      --surface: #ffffff;
      --ink: #1a1f2e;
      --muted: #5c6578;
      --accent: #0d6e6e;
      --accent-hover: #095858;
      --border: #d8d4cb;
      --ok: #1b7a3d;
      --ok-bg: #e8f6ee;
      --bad: #b42318;
      --bad-bg: #fef3f2;
      --code-bg: #1e2433;
      --code-fg: #e8ecf4;
      --shadow: 0 1px 3px rgba(26, 31, 46, 0.08);
      --radius: 10px;
      --font: "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "Fira Code", "Consolas", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #e4f0ef 0%, transparent 45%),
        radial-gradient(ellipse at bottom right, #efe8dc 0%, transparent 40%),
        var(--bg);
      line-height: 1.55;
      min-height: 100vh;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      margin: 0 -0.25rem 1.5rem;
      background: rgba(247, 245, 241, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .progress {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .progress span { color: var(--accent); }

    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    button.secondary:hover:not(:disabled) {
      background: #efece4;
    }

    #result {
      display: none;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.5rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 2px solid var(--accent);
      box-shadow: var(--shadow);
    }

    #result.visible { display: block; }

    #result h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }

    #result .score-line {
      font-size: 1.1rem;
      margin: 0.25rem 0;
    }

    #result .hint {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .question {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.25rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      scroll-margin-top: 5.5rem;
    }

    .question.correct {
      border-color: var(--ok);
      background: var(--ok-bg);
    }

    .question.incorrect {
      border-color: var(--bad);
      background: var(--bad-bg);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #e6efef;
      color: var(--accent);
    }

    .q-num {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .q-text {
      margin: 0 0 0.75rem;
      font-size: 1.02rem;
      font-weight: 600;
    }

    pre.code {
      margin: 0 0 0.9rem;
      padding: 0.85rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-fg);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .choices {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.45rem;
    }

    .choices label {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: #fafaf8;
    }

    .choices label:hover {
      border-color: var(--accent);
      background: #f0f7f7;
    }

    .question.submitted .choices label {
      cursor: default;
    }

    .choices input {
      margin-top: 0.2rem;
      flex-shrink: 0;
    }

    .feedback {
      display: none;
      margin-top: 0.9rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
      font-size: 0.92rem;
    }

    .question.submitted .feedback { display: block; }

    .feedback .verdict {
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .feedback .verdict.ok { color: var(--ok); }
    .feedback .verdict.bad { color: var(--bad); }

    .feedback .answer { margin: 0.25rem 0; }
    .feedback .explain { margin: 0.35rem 0 0; color: var(--muted); }

    .msg {
      color: var(--bad);
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 1.2em;
    }

    footer.nav {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer.nav a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      margin-right: 1rem;
    }

    footer.nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>JavaScript Quiz — Level Vừa</h1>
      <p>String, Array, Vòng lặp, DOM, Event Handling · 50 câu · 1 đáp án đúng</p>
    </header>

    <div class="toolbar">
      <div class="progress">Đã chọn: <span id="answeredCount">0</span> / 50</div>
      <div class="actions">
        <button type="button" class="secondary" id="scrollMissingBtn">Tới câu trống</button>
        <button type="button" id="submitBtn" disabled>Nộp bài</button>
      </div>
    </div>
    <p class="msg" id="statusMsg" role="status"></p>

    <div id="result" aria-live="polite">
      <h2>Kết quả</h2>
      <p class="score-line" id="scoreLine"></p>
      <p class="hint">Xem từng câu bên dưới: đáp án đúng và giải thích ngắn.</p>
    </div>

    <form id="quizForm"></form>

    <footer class="nav">
      <a href="easy.html">Dễ</a>
      <a href="medium.html">Vừa</a>
      <a href="hard.html">Khó</a>
    </footer>
  </div>

  <script>
    const TOPIC_LABELS = {"string":"String","array":"Array","loop":"Vòng lặp","dom":"DOM","event":"Event"};
    const EXPECTED_TOPICS = {"string":10,"array":10,"loop":10,"dom":10,"event":10};
    const questions = [{"id":1,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'hello world'.replace('o', '0')","choices":["'hell0 world'","'hello w0rld'","'hell0 w0rld'","'hello world'"],"correctIndex":0,"explanation":"replace() chỉ thay thế lần xuất hiện đầu tiên, không thay tất cả."},{"id":2,"topic":"string","question":"Phương thức nào thay thế TẤT CẢ các lần xuất hiện của chuỗi con?","code":null,"choices":["replace()","replaceAll()","substring()","slice()"],"correctIndex":1,"explanation":"replaceAll() thay mọi lần khớp; replace() chỉ thay lần đầu (trừ khi dùng regex /g)."},{"id":3,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'JavaScript'.slice(-6, -1)","choices":["'Script'","'cript'","'Scrip'","''"],"correctIndex":2,"explanation":"slice(-6, -1) tương đương slice(4, 9), lấy từ index 4 đến trước 9 → \"Scrip\"."},{"id":4,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'JavaScript'.substring(-6, -1)","choices":["'Script'","''","'JavaS'","'cript'"],"correctIndex":1,"explanation":"substring() coi số âm như 0, nên substring(-6, -1) → substring(0, 0) → chuỗi rỗng."},{"id":5,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'42'.padStart(5, '0')","choices":["'00042'","'42000'","'042'","'42'"],"correctIndex":0,"explanation":"padStart(5, \"0\") căn trái và thêm \"0\" phía trước cho đủ 5 ký tự."},{"id":6,"topic":"string","question":"padEnd(4, \"*\") áp dụng lên \"ab\" cho kết quả nào?","code":null,"choices":["'ab**'","'**ab'","'abab'","'ab'"],"correctIndex":0,"explanation":"padEnd thêm ký tự phía sau cho đủ độ dài; \"ab\" + \"**\" = \"ab**\"."},{"id":7,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'banana'.replace(/a/g, 'o')","choices":["'bonono'","'bonana'","'bonon'","'bannno'"],"correctIndex":0,"explanation":"Regex /a/g khớp mọi chữ \"a\" toàn cục, thay bằng \"o\" → \"bonono\"."},{"id":8,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'abcdef'.substring(4, 1)","choices":["'bcd'","'abc'","'cde'","''"],"correctIndex":0,"explanation":"substring() tự hoán đổi nếu start > end: substring(4,1) → substring(1,4) → \"bcd\"."},{"id":9,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"`Tổng: ${2 + 3}`","choices":["'Tổng: 5'","'Tổng: ${2 + 3}'","'Tổng: 23'","'Tổng: 2 + 3'"],"correctIndex":0,"explanation":"Template literal `${}` đánh giá biểu thức bên trong, 2+3=5."},{"id":10,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'  hello  '.trim().replace('hello', 'hi')","choices":["'hi'","'  hi  '","'  hello  '","'hi  '"],"correctIndex":0,"explanation":"trim() bỏ khoảng trắng hai đầu thành \"hello\", rồi replace → \"hi\"."},{"id":11,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].map(x => x * 2)","choices":["[2, 4, 6]","[1, 2, 3]","[3, 4, 5]","6"],"correctIndex":0,"explanation":"map() tạo mảng mới, mỗi phần tử nhân 2."},{"id":12,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3, 4, 5].filter(x => x % 2 === 0)","choices":["[2, 4]","[1, 3, 5]","[2, 4, 6]","[]"],"correctIndex":0,"explanation":"filter() giữ lại phần tử chia hết cho 2."},{"id":13,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[10, 20, 30].find(x => x > 15)","choices":["20","30","undefined","[20, 30]"],"correctIndex":0,"explanation":"find() trả về phần tử ĐẦU TIÊN thỏa điều kiện (>15) → 20."},{"id":14,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 3, 5].find(x => x % 2 === 0)","choices":["undefined","null","0","false"],"correctIndex":0,"explanation":"Không có phần tử chẵn nào, find() trả về undefined."},{"id":15,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[2, 4, 6].every(x => x % 2 === 0)","choices":["true","false","undefined","[2, 4, 6]"],"correctIndex":0,"explanation":"every() kiểm tra TẤT CẢ phần tử; mọi số đều chẵn → true."},{"id":16,"topic":"array","question":"Sau khi chạy code sau, giá trị của a là gì?","code":"const a = [1]; const b = a.concat([2]);\na;","choices":["[1]","[1, 2]","[2]","[]"],"correctIndex":0,"explanation":"concat() không thay đổi mảng gốc; a vẫn là [1], b là [1, 2]."},{"id":17,"topic":"array","question":"Sau khi chạy code sau, arr và giá trị trả về là gì?","code":"const arr = [1, 2, 3, 4];\nconst result = arr.slice(1, 3);","choices":["result=[2,3], arr=[1,2,3,4]","result=[2,3], arr=[1,4]","result=[1,2], arr=[1,2,3,4]","result=[2,3,4], arr=[1]"],"correctIndex":0,"explanation":"slice() trả về bản sao phần [1..3), không đổi mảng gốc."},{"id":18,"topic":"array","question":"Sau khi chạy code sau, arr là gì?","code":"const arr = [1, 2, 3, 4];\narr.splice(1, 2);\narr;","choices":["[1, 4]","[2, 3]","[1, 2, 3, 4]","[1, 2]"],"correctIndex":0,"explanation":"splice(1,2) xóa 2 phần tử từ index 1 (2 và 3), còn lại [1, 4]."},{"id":19,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].some(x => x > 2)","choices":["true","false","3","undefined"],"correctIndex":0,"explanation":"some() trả true nếu CÓ ÍT NHẤT MỘT phần tử > 2; số 3 thỏa."},{"id":20,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3, 4, 5].filter(x => x > 2).map(x => x * 10)","choices":["[30, 40, 50]","[3, 4, 5]","[10, 20, 30]","[3, 40, 50]"],"correctIndex":0,"explanation":"filter giữ [3,4,5], map nhân 10 → [30,40,50]."},{"id":21,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let count = 0;\nfor (let i = 0; i < 3; i++) {\n  for (let j = 0; j < 2; j++) {\n    count++;\n  }\n}\ncount;","choices":["6","5","3","2"],"correctIndex":0,"explanation":"Vòng ngoài 3 lần × vòng trong 2 lần = 6 lần count++."},{"id":22,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let sum = 0;\nfor (let i = 0; i < 5; i++) {\n  if (i === 3) break;\n  sum += i;\n}\nsum;","choices":["3","6","10","0"],"correctIndex":0,"explanation":"Cộng i=0,1,2 rồi break khi i=3; sum = 0+1+2 = 3."},{"id":23,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let s = '';\nfor (let i = 0; i < 5; i++) {\n  if (i % 2 === 0) continue;\n  s += i;\n}\ns;","choices":["'13'","'024'","'1234'","'135'"],"correctIndex":0,"explanation":"continue bỏ qua số chẵn; chỉ nối i=1 và i=3 → \"13\"."},{"id":24,"topic":"loop","question":"for...of duyệt mảng [10, 20, 30] sẽ lần lượt gán giá trị nào cho biến?","code":"for (const item of [10, 20, 30]) { /* ... */ }","choices":["10, 20, 30","0, 1, 2","'0', '1', '2'","undefined"],"correctIndex":0,"explanation":"for...of lặp qua GIÁ TRỊ phần tử, không phải index."},{"id":25,"topic":"loop","question":"for...in duyệt mảng ['a', 'b'] sẽ lần lượt gán gì cho biến key?","code":"for (const key in ['a', 'b']) { /* ... */ }","choices":["'0', '1'","'a', 'b'","0, 1 (number)","1, 2"],"correctIndex":0,"explanation":"for...in trả về tên thuộc tính (index dạng chuỗi): \"0\", \"1\"."},{"id":26,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let sum = 0;\nfor (let i = 1; i <= 2; i++) {\n  for (let j = 1; j <= 3; j++) {\n    sum += j;\n  }\n}","choices":["12","6","9","3"],"correctIndex":0,"explanation":"Mỗi vòng ngoài: 1+2+3=6; chạy 2 lần → sum=12."},{"id":27,"topic":"loop","question":"break trong vòng lặp lồng nhau (không có label) sẽ thoát vòng nào?","code":null,"choices":["Chỉ vòng lặp trong cùng (inner)","Cả hai vòng lặp","Vòng lặp ngoài (outer)","Toàn bộ hàm"],"correctIndex":0,"explanation":"break không label chỉ thoát khỏi vòng lặp hiện tại (inner)."},{"id":28,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let str = '';\nfor (const ch of 'ab') {\n  str += ch + '-';\n}","choices":["'a-b-'","'ab-'","'a-b'","'0-1-'"],"correctIndex":0,"explanation":"for...of duyệt từng ký tự \"a\", \"b\" và nối thêm \"-\"."},{"id":29,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let n = 0;\nlet i = 0;\nwhile (i < 5) {\n  i++;\n  if (i === 3) continue;\n  n++;\n}\nn;","choices":["4","5","3","2"],"correctIndex":0,"explanation":"i chạy 1→5; bỏ qua n++ khi i=3; n tăng 4 lần (i=1,2,4,5)."},{"id":30,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let out = [];\nfor (let i = 0; i < 3; i++) {\n  for (let j = 0; j < 3; j++) {\n    if (j === 1) break;\n    out.push(i + j);\n  }\n}\nout;","choices":["[0, 1, 2]","[0, 1, 2, 3, 4]","[0, 2, 4]","[0, 1]"],"correctIndex":0,"explanation":"Mỗi i chỉ push khi j=0 (break tại j=1): 0+0=0, 1+0=1, 2+0=2."},{"id":31,"topic":"dom","question":"element.classList.add(\"active\") làm gì?","code":null,"choices":["Thêm class \"active\" vào phần tử","Thay thế toàn bộ class bằng \"active\"","Xóa class \"active\"","Kiểm tra phần tử có class \"active\" không"],"correctIndex":0,"explanation":"classList.add() thêm một class vào danh sách class hiện có."},{"id":32,"topic":"dom","question":"element.classList.toggle(\"open\") khi phần tử chưa có class \"open\" sẽ?","code":null,"choices":["Thêm class \"open\"","Xóa class \"open\"","Trả về false","Không làm gì"],"correctIndex":0,"explanation":"toggle() bật/tắt class: chưa có thì thêm, đã có thì xóa."},{"id":33,"topic":"dom","question":"setAttribute(\"data-id\", \"42\") dùng để làm gì?","code":null,"choices":["Gán attribute data-id=\"42\" lên phần tử","Gán thuộc tính JavaScript dataId = 42","Tạo phần tử mới có id=42","Xóa attribute data-id"],"correctIndex":0,"explanation":"setAttribute() đặt giá trị attribute HTML trên phần tử DOM."},{"id":34,"topic":"dom","question":"document.querySelectorAll(\".item\") trả về kiểu gì?","code":null,"choices":["NodeList","Array","HTMLCollection","Element"],"correctIndex":0,"explanation":"querySelectorAll() trả về NodeList (giống mảng nhưng không phải Array)."},{"id":35,"topic":"dom","question":"NodeList từ querySelectorAll có thể gọi trực tiếp .map() không?","code":null,"choices":["Không, cần Array.from() hoặc [...nodeList] trước","Có, NodeList là Array","Có, nếu có ít nhất 1 phần tử","Chỉ khi dùng forEach trước"],"correctIndex":0,"explanation":"NodeList khô arget khác event.target khi click vào <span> bên trong <button> có listener?","code":null,"choices":["currentTarget là button, target là span","Cả hai đều là span","Cả hai đều là button","currentTarget là span, target là button"],"correctIndex":0,"explanation":"Listener trên button: currentTarget=button, target=span (phần tử được click)."},{"id":43,"topic":"event","question":"Event bubbling là gì?","code":null,"choices":["Sự kiện lan từ phần tử con lên phần tử cha","Sự kiện lan từ cha xuống con","Sự kiện chỉ chạy một lần trên target","Hủy sự kiện mặc định của trình duyệt"],"correctIndex":0,"explanation":"Bubbling: sau target, sự kiện nổi bọt lên các ancestor."},{"id":44,"topic":"event","question":"event.stopPropagation() làm gì?","code":null,"choices":["Ngăn sự kiện lan lên phần tử cha","Ngăn hành vi mặc định (như submit form)","Xóa listener","Dừng vòng lặp JavaScript"],"correctIndex":0,"explanation":"stopPropagation() chặn bubbling; preventDefault() chặn hành vi mặc định."},{"id":45,"topic":"event","question":"Sự kiện \"input\" trên <input type=\"text\"> kích hoạt khi nào?","code":null,"choices":["Mỗi khi giá trị thay đổi (gõ phím)","Chỉ khi blur (rời khỏi ô)","Chỉ khi nhấn Enter","Chỉ khi submit form"],"correctIndex":0,"explanation":"input fire liên tục khi người dùng gõ; change thường fire khi commit."},{"id":46,"topic":"event","question":"Sự kiện \"change\" trên <select> kích hoạt khi nào?","code":null,"choices":["Khi người dùng chọn option khác","Mỗi lần di chuột qua","Khi trang load xong","Khi nhấn phím bất kỳ"],"correctIndex":0,"explanation":"change trên select fire khi giá trị được chọn thay đổi."},{"id":47,"topic":"event","question":"Sự kiện \"keydown\" xảy ra khi nào?","code":null,"choices":["Khi phím được nhấn xuống","Khi phím được thả ra","Sau khi ký tự hiện trong input","Chỉ với phím Enter"],"correctIndex":0,"explanation":"keydown khi nhấn phím; keyup khi thả; input sau khi giá trị đổi."},{"id":48,"topic":"event","question":"Click vào <li> bên trong <ul id=\"list\"> có listener trên ul — thứ tự bubbling?","code":"list.addEventListener(\"click\", handler);","choices":["li (target) → ul → ... → document","ul → li → document","document → ul → li","Chỉ chạy handler trên ul"],"correctIndex":0,"explanation":"Bubbling bắt đầu tại target (li) rồi lan lên ul, body, document."},{"id":49,"topic":"event","question":"Trên <input type=\"text\">, \"input\" khác \"change\" ở điểm nào?","code":null,"choices":["input fire mỗi ký tự; change fire khi blur hoặc Enter","change fire mỗi ký tự; input chỉ khi blur","Hai sự kiện giống hệt nhau","input chỉ fire với checkbox"],"correctIndex":0,"explanation":"input: realtime mỗi thay đổi; change: thường sau khi commit (blur/Enter)."},{"id":50,"topic":"event","question":"Trong handler keydown, event.key === \"Enter\" dùng để?","code":null,"choices":["Phát hiện người dùng nhấn phím Enter","Submit form tự động không cần code","Chặn mọi phím khác Enter","Focus vào input"],"correctIndex":0,"explanation":"event.key cho biết phím nào được nhấn; so sánh \"Enter\" để xử lý."}];

    const form = document.getElementById('quizForm');
    const answeredCountEl = document.getElementById('answeredCount');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const resultBox = document.getElementById('result');
    const scoreLine = document.getElementById('scoreLine');
    const scrollMissingBtn = document.getElementById('scrollMissingBtn');

    let submitted = false;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getAnswers() {
      const answers = {};
      for (const q of questions) {
        const checked = form.querySelector('input[name="q' + q.id + '"]:checked');
        if (checked) answers[q.id] = Number(checked.value);
      }
      return answers;
    }

    function answeredCount() {
      return Object.keys(getAnswers()).length;
    }

    function updateProgress() {
      const n = answeredCount();
      answeredCountEl.textContent = String(n);
      submitBtn.disabled = submitted || n < questions.length;
      if (!submitted && n === questions.length) {
        statusMsg.textContent = 'Đã trả lời hết — có thể nộp bài.';
        statusMsg.style.color = 'var(--ok)';
      } else if (!submitted) {
        statusMsg.textContent = '';
        statusMsg.style.color = '';
      }
    }

    function firstMissing() {
      const answers = getAnswers();
      return questions.find(function (q) { return answers[q.id] === undefined; });
    }

    function render() {
      const letters = ['A', 'B', 'C', 'D'];
      form.innerHTML = questions.map(function (q) {
        const codeBlock = q.code
          ? '<pre class="code"><code>' + escapeHtml(q.code) + '</code></pre>'
          : '';
        const choices = q.choices.map(function (choice, i) {
          return (
            '<li><label>' +
            '<input type="radio" name="q' + q.id + '" value="' + i + '">' +
            '<span><strong>' + letters[i] + '.</strong> ' + escapeHtml(choice) + '</span>' +
            '</label></li>'
          );
        }).join('');
        return (
          '<article class="question" id="question-' + q.id + '" data-id="' + q.id + '">' +
          '<div class="q-meta">' +
          '<span class="q-num">Câu ' + q.id + '</span>' +
          '<span class="badge">' + escapeHtml(TOPIC_LABELS[q.topic] || q.topic) + '</span>' +
          '</div>' +
          '<p class="q-text">' + escapeHtml(q.question) + '</p>' +
          codeBlock +
          '<ul class="choices">' + choices + '</ul>' +
          '<div class="feedback" id="feedback-' + q.id + '"></div>' +
          '</article>'
        );
      }).join('');
    }

    function submitQuiz() {
      if (submitted) return;
      const n = answeredCount();
      if (n < questions.length) {
        const missing = questions.length - n;
        statusMsg.textContent = 'Còn ' + missing + ' câu chưa trả lời. Hãy chọn hết rồi nộp.';
        statusMsg.style.color = 'var(--bad)';
        const first = firstMissing();
        if (first) {
          const el = document.getElementById('question-' + first.id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return;
      }

      submitted = true;
      const answers = getAnswers();
      let correct = 0;
      const letters = ['A', 'B', 'C', 'D'];

      for (const q of questions) {
        const article = document.getElementById('question-' + q.id);
        const feedback = document.getElementById('feedback-' + q.id);
        const selected = answers[q.id];
        const isCorrect = selected === q.correctIndex;
        if (isCorrect) correct += 1;

        article.classList.add('submitted', isCorrect ? 'correct' : 'incorrect');
        article.querySelectorAll('input').forEach(function (input) {
          input.disabled = true;
        });

        const correctLabel = letters[q.correctIndex] + '. ' + q.choices[q.correctIndex];
        if (isCorrect) {
          feedback.innerHTML =
            '<div class="verdict ok">Đúng</div>' +
            '<p class="explain">' + escapeHtml(q.explanation) + '</p>';
        } else {
          feedback.innerHTML =
            '<div class="verdict bad">Sai</div>' +
            '<p class="answer"><strong>Đáp án đúng:</strong> ' + escapeHtml(correctLabel) + '</p>' +
            '<p class="explain">' + escapeHtml(q.explanation) + '</p>';
        }
      }

      const pct = Math.round((correct / questions.length) * 100);
      scoreLine.textContent = 'Đúng: ' + correct + '/' + questions.length + ' (' + pct + '%)';
      resultBox.classList.add('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đã nộp';
      statusMsg.textContent = '';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    form.addEventListener('change', updateProgress);
    submitBtn.addEventListener('click', submitQuiz);
    scrollMissingBtn.addEventListener('click', function () {
      const first = firstMissing();
      if (!first) {
        statusMsg.textContent = 'Không còn câu trống.';
        statusMsg.style.color = 'var(--ok)';
        return;
      }
      const el = document.getElementById('question-' + first.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    render();
    updateProgress();

    // Dev self-check (console only)
    (function selfCheck() {
      if (questions.length !== 50) console.error('Expected 50 questions, got', questions.length);
      const counts = {};
      questions.forEach(function (q) {
        counts[q.topic] = (counts[q.topic] || 0) + 1;
      });
      Object.keys(EXPECTED_TOPICS).forEach(function (t) {
        if (counts[t] !== EXPECTED_TOPICS[t]) {
          console.error('Topic mismatch', t, counts[t], EXPECTED_TOPICS[t]);
        }
      });
    })();
  </script>
