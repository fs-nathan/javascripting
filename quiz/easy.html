<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Quiz — Level Dễ</title>
  <style>
    :root {
      --bg: #f7f5f1;
      --surface: #ffffff;
      --ink: #1a1f2e;
      --muted: #5c6578;
      --accent: #0d6e6e;
      --accent-hover: #095858;
      --border: #d8d4cb;
      --ok: #1b7a3d;
      --ok-bg: #e8f6ee;
      --bad: #b42318;
      --bad-bg: #fef3f2;
      --code-bg: #1e2433;
      --code-fg: #e8ecf4;
      --shadow: 0 1px 3px rgba(26, 31, 46, 0.08);
      --radius: 10px;
      --font: "Segoe UI", system-ui, sans-serif;
      --mono: "SF Mono", "Fira Code", "Consolas", monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(ellipse at top left, #e4f0ef 0%, transparent 45%),
        radial-gradient(ellipse at bottom right, #efe8dc 0%, transparent 40%),
        var(--bg);
      line-height: 1.55;
      min-height: 100vh;
    }

    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 4rem;
    }

    header {
      margin-bottom: 1.5rem;
    }

    header h1 {
      margin: 0 0 0.35rem;
      font-size: clamp(1.5rem, 4vw, 2rem);
      letter-spacing: -0.02em;
    }

    header p {
      margin: 0;
      color: var(--muted);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1rem;
      margin: 0 -0.25rem 1.5rem;
      background: rgba(247, 245, 241, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .progress {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .progress span { color: var(--accent); }

    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    button {
      font: inherit;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 0.55rem 1.1rem;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    button:hover:not(:disabled) { background: var(--accent-hover); }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    button.secondary:hover:not(:disabled) {
      background: #efece4;
    }

    #result {
      display: none;
      padding: 1.25rem 1.35rem;
      margin-bottom: 1.5rem;
      border-radius: var(--radius);
      background: var(--surface);
      border: 2px solid var(--accent);
      box-shadow: var(--shadow);
    }

    #result.visible { display: block; }

    #result h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }

    #result .score-line {
      font-size: 1.1rem;
      margin: 0.25rem 0;
    }

    #result .hint {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .question {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.15rem 1.25rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      scroll-margin-top: 5.5rem;
    }

    .question.correct {
      border-color: var(--ok);
      background: var(--ok-bg);
    }

    .question.incorrect {
      border-color: var(--bad);
      background: var(--bad-bg);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.55rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 0.2rem 0.5rem;
      border-radius: 999px;
      background: #e6efef;
      color: var(--accent);
    }

    .q-num {
      font-weight: 700;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .q-text {
      margin: 0 0 0.75rem;
      font-size: 1.02rem;
      font-weight: 600;
    }

    pre.code {
      margin: 0 0 0.9rem;
      padding: 0.85rem 1rem;
      overflow-x: auto;
      background: var(--code-bg);
      color: var(--code-fg);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.85rem;
      line-height: 1.45;
    }

    .choices {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.45rem;
    }

    .choices label {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      padding: 0.55rem 0.7rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      background: #fafaf8;
    }

    .choices label:hover {
      border-color: var(--accent);
      background: #f0f7f7;
    }

    .question.submitted .choices label {
      cursor: default;
    }

    .choices input {
      margin-top: 0.2rem;
      flex-shrink: 0;
    }

    .feedback {
      display: none;
      margin-top: 0.9rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
      font-size: 0.92rem;
    }

    .question.submitted .feedback { display: block; }

    .feedback .verdict {
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .feedback .verdict.ok { color: var(--ok); }
    .feedback .verdict.bad { color: var(--bad); }

    .feedback .answer { margin: 0.25rem 0; }
    .feedback .explain { margin: 0.35rem 0 0; color: var(--muted); }

    .msg {
      color: var(--bad);
      font-size: 0.9rem;
      font-weight: 600;
      min-height: 1.2em;
    }

    footer.nav {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.9rem;
    }

    footer.nav a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
      margin-right: 1rem;
    }

    footer.nav a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>JavaScript Quiz — Level Dễ</h1>
      <p>String, Array, Vòng lặp, DOM, Event Handling · 50 câu · 1 đáp án đúng</p>
    </header>

    <div class="toolbar">
      <div class="progress">Đã chọn: <span id="answeredCount">0</span> / 50</div>
      <div class="actions">
        <button type="button" class="secondary" id="scrollMissingBtn">Tới câu trống</button>
        <button type="button" id="submitBtn" disabled>Nộp bài</button>
      </div>
    </div>
    <p class="msg" id="statusMsg" role="status"></p>

    <div id="result" aria-live="polite">
      <h2>Kết quả</h2>
      <p class="score-line" id="scoreLine"></p>
      <p class="hint">Xem từng câu bên dưới: đáp án đúng và giải thích ngắn.</p>
    </div>

    <form id="quizForm"></form>

    <footer class="nav">
      <a href="easy.html">Dễ</a>
      <a href="medium.html">Vừa</a>
      <a href="hard.html">Khó</a>
    </footer>
  </div>

  <script>
    const TOPIC_LABELS = {"string":"String","array":"Array","loop":"Vòng lặp","dom":"DOM","event":"Event"};
    const EXPECTED_TOPICS = {"string":12,"array":12,"loop":12,"dom":8,"event":6};
    const questions = [{"id":1,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'Hello'.length","choices":["4","5","6","undefined"],"correctIndex":1,"explanation":"Thuộc tính length trả về số ký tự trong chuỗi. 'Hello' có 5 ký tự."},{"id":2,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'hello'.toUpperCase()","choices":["hello","HELLO","Hello","HELLO()"],"correctIndex":1,"explanation":"toUpperCase() chuyển tất cả ký tự trong chuỗi sang chữ HOA."},{"id":3,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'WORLD'.toLowerCase()","choices":["WORLD","world","World","wORLD"],"correctIndex":1,"explanation":"toLowerCase() chuyển tất cả ký tự trong chuỗi sang chữ thường."},{"id":4,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'JavaScript'.includes('Script')","choices":["true","false","1","-1"],"correctIndex":0,"explanation":"includes() kiểm tra chuỗi con có tồn tại không, trả về true hoặc false."},{"id":5,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'banana'.indexOf('a')","choices":["0","1","2","-1"],"correctIndex":1,"explanation":"indexOf() trả về vị trí đầu tiên tìm thấy ký tự 'a' trong 'banana' — tại index 1."},{"id":6,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'abcdef'.slice(1, 4)","choices":["abc","bcd","bcde","abcd"],"correctIndex":1,"explanation":"slice(1, 4) lấy ký tự từ index 1 đến trước index 4, tức 'bcd'."},{"id":7,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'  hello  '.trim()","choices":["  hello  ","hello"," hello ","hello  "],"correctIndex":1,"explanation":"trim() xóa khoảng trắng ở đầu và cuối chuỗi."},{"id":8,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'a,b,c'.split(',')","choices":["a,b,c","['a', 'b', 'c']","abc","['a,b,c']"],"correctIndex":1,"explanation":"split(',') tách chuỗi tại dấu phẩy thành mảng ['a', 'b', 'c']."},{"id":9,"topic":"string","question":"Phương thức nào dùng để kiểm tra chuỗi con có nằm trong chuỗi không?","code":null,"choices":["indexOf()","includes()","slice()","split()"],"correctIndex":1,"explanation":"includes() trả về true/false khi kiểm tra sự tồn tại của chuỗi con."},{"id":10,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'hello world'.includes('World')","choices":["true","false","0","1"],"correctIndex":1,"explanation":"includes() phân biệt hoa thường. 'World' khác 'world' nên trả về false."},{"id":11,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'testing'.indexOf('x')","choices":["0","1","-1","undefined"],"correctIndex":2,"explanation":"indexOf() trả về -1 khi không tìm thấy chuỗi con trong chuỗi."},{"id":12,"topic":"string","question":"Kết quả của đoạn code sau là gì?","code":"'hello'.slice(-2)","choices":["he","lo","ell","o"],"correctIndex":1,"explanation":"slice(-2) lấy 2 ký tự cuối cùng của chuỗi, tức 'lo'."},{"id":13,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].push(4)","choices":["4","3","[1, 2, 3, 4]","undefined"],"correctIndex":0,"explanation":"push() thêm phần tử vào cuối mảng và trả về độ dài mới của mảng (4)."},{"id":14,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].pop()","choices":["1","2","3","[1, 2]"],"correctIndex":2,"explanation":"pop() xóa và trả về phần tử cuối cùng của mảng."},{"id":15,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].shift()","choices":["1","2","3","[2, 3]"],"correctIndex":0,"explanation":"shift() xóa và trả về phần tử đầu tiên của mảng."},{"id":16,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].unshift(0)","choices":["0","3","4","[0, 1, 2, 3]"],"correctIndex":2,"explanation":"unshift(0) thêm 0 vào đầu mảng và trả về độ dài mới (4)."},{"id":17,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].length","choices":["2","3","4","undefined"],"correctIndex":1,"explanation":"Thuộc tính length trả về số phần tử trong mảng."},{"id":18,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].includes(2)","choices":["true","false","1","2"],"correctIndex":0,"explanation":"includes(2) kiểm tra mảng có chứa giá trị 2 không — trả về true."},{"id":19,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].indexOf(4)","choices":["0","3","-1","undefined"],"correctIndex":2,"explanation":"indexOf() trả về -1 khi không tìm thấy giá trị trong mảng."},{"id":20,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"const arr = [10, 20, 30];\narr[1]","choices":["10","20","30","undefined"],"correctIndex":1,"explanation":"Truy cập phần tử mảng bằng index: arr[1] là phần tử thứ hai (20)."},{"id":21,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"const a = [1, 2];\na.push(3);\na.length","choices":["2","3","4","undefined"],"correctIndex":1,"explanation":"Sau push(3), mảng có 3 phần tử nên length trả về 3."},{"id":22,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"const a = [1, 2, 3];\na.pop();\na","choices":["[1, 2, 3]","[1, 2]","[2, 3]","3"],"correctIndex":1,"explanation":"pop() xóa phần tử cuối (3), mảng còn lại [1, 2]."},{"id":23,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"const a = [1, 2, 3];\na.shift();\na","choices":["[1, 2, 3]","[2, 3]","[1, 2]","1"],"correctIndex":1,"explanation":"shift() xóa phần tử đầu (1), mảng còn lại [2, 3]."},{"id":24,"topic":"array","question":"Kết quả của đoạn code sau là gì?","code":"[1, 2, 3].includes('2')","choices":["true","false","1","-1"],"correctIndex":1,"explanation":"includes() dùng so sánh nghiêm ngặt (===). Số 2 khác chuỗi '2' nên trả về false."},{"id":25,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let sum = 0;\nfor (let i = 1; i <= 3; i++) {\n  sum += i;\n}\nsum","choices":["3","6","9","0"],"correctIndex":1,"explanation":"Vòng for cộng 1 + 2 + 3 = 6."},{"id":26,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let count = 0;\nwhile (count < 3) {\n  count++;\n}\ncount","choices":["2","3","4","0"],"correctIndex":1,"explanation":"Vòng while tăng count từ 0 đến 3 (dừng khi count === 3)."},{"id":27,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let result = '';\nfor (const ch of 'abc') {\n  result += ch;\n}\nresult","choices":["abc","cba","a,b,c","3"],"correctIndex":0,"explanation":"for...of duyệt từng ký tự trong chuỗi 'abc' và nối lại."},{"id":28,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let total = 0;\nconst nums = [2, 4, 6];\nfor (const n of nums) {\n  total += n;\n}\ntotal","choices":["6","10","12","3"],"correctIndex":2,"explanation":"for...of cộng 2 + 4 + 6 = 12."},{"id":29,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let i = 0;\nwhile (i < 5) {\n  i += 2;\n}\ni","choices":["4","5","6","2"],"correctIndex":2,"explanation":"i tăng 0 → 2 → 4 → 6. Khi i = 6, điều kiện i < 5 sai, vòng lặp dừng."},{"id":30,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let s = 0;\nfor (let i = 0; i < 4; i++) {\n  s++;\n}\ns","choices":["3","4","5","0"],"correctIndex":1,"explanation":"Vòng for chạy 4 lần (i = 0, 1, 2, 3), mỗi lần s tăng 1 → s = 4."},{"id":31,"topic":"loop","question":"Vòng lặp nào phù hợp nhất để duyệt từng phần tử của một mảng?","code":null,"choices":["for...in","for...of","do...while","switch"],"correctIndex":1,"explanation":"for...of được thiết kế để duyệt giá trị của iterable như mảng và chuỗi."},{"id":32,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let x = 1;\nfor (let i = 0; i < 3; i++) {\n  x *= 2;\n}\nx","choices":["4","6","8","16"],"correctIndex":2,"explanation":"x nhân đôi 3 lần: 1 → 2 → 4 → 8."},{"id":33,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let n = 5;\nwhile (n > 0) {\n  n--;\n}\nn","choices":["-1","0","1","5"],"correctIndex":1,"explanation":"Vòng while giảm n từ 5 xuống 0, dừng khi n không còn lớn hơn 0."},{"id":34,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let str = '';\nfor (let i = 0; i < 3; i++) {\n  str += i;\n}\nstr","choices":["012","123","0123",""],"correctIndex":0,"explanation":"Vòng for nối giá trị i (0, 1, 2) vào chuỗi → '012'."},{"id":35,"topic":"loop","question":"Vòng lặp for cơ bản gồm những phần nào?","code":null,"choices":["khởi tạo; điều kiện; bước nhảy","điều kiện; khởi tạo; bước nhảy","bước nhảy; điều kiện; khởi tạo","khởi tạo; bước nhảy; điều kiện"],"correctIndex":0,"explanation":"Cú pháp for: for (khởi tạo; điều kiện; bước nhảy) { ... }."},{"id":36,"topic":"loop","question":"Kết quả của đoạn code sau là gì?","code":"let arr = [];\nfor (let i = 1; i <= 3; i++) {\n  arr.push(i * 2);\n}\narr","choices":["[1, 2, 3]","[2, 4, 6]","[2, 3, 4]","[1, 4, 9]"],"correctIndex":1,"explanation":"Mỗi lần lặp push i * 2: 2, 4, 6 → mảng [2, 4, 6]."},{"id":37,"topic":"dom","question":"Phương thức nào dùng để lấy phần tử HTML theo thuộc tính id?","code":null,"choices":["querySelector()","getElementById()","getElementsByClassName()","createElement()"],"correctIndex":1,"explanation":"getElementById('myId') trả về phần tử có id tương ứng."},{"id":38,"topic":"dom","question":"Phương thức nào dùng để chọn phần tử đầu tiên khớp với CSS selector?","code":null,"choices":["getElementById()","querySelector()","getElementsByTagName()","appendChild()"],"correctIndex":1,"explanation":"querySelector('.class') hoặc querySelector('#id') chọn phần tử đầu tiên khớp selector."},{"id":39,"topic":"dom","question":"Thuộc tính nào dùng để đọc hoặc ghi nội dung văn bản thuần của phần tử?","code":null,"choices":["innerHTML","textContent","value","className"],"correctIndex":1,"explanation":"textContent lấy hoặc đặt nội dung văn bản, không parse HTML."},{"id":40,"topic":"dom","question":"Sự khác biệt chính giữa textContent và innerHTML là gì?","code":null,"choices":["textContent parse HTML, innerHTML thì không","innerHTML parse HTML, textContent chỉ là văn bản thuần","Cả hai giống hệt nhau","textContent chỉ dùng cho input"],"correctIndex":1,"explanation":"innerHTML có thể chèn và render thẻ HTML; textContent chỉ xử lý văn bản thuần."},{"id":41,"topic":"dom","question":"Phương thức nào dùng để tạo một phần tử HTML mới?","code":null,"choices":["createElement()","querySelector()","getElementById()","addEventListener()"],"correctIndex":0,"explanation":"createElement('div') tạo phần tử DOM mới nhưng chưa gắn vào trang."},{"id":42,"topic":"dom","question":"Đoạn code nào đúng để lấy phần tử có id là \"title\"?","code":null,"choices":["document.getElementById('title')","document.querySelector('title')","document.getElement('#title')","document.findById('title')"],"correctIndex":0,"explanation":"getElementById nhận tên id (không cần dấu #). querySelector thì cần '#title'."},{"id":43,"topic":"dom","question":"Sau khi tạo phần tử mới, làm sao để thêm nó vào cuối phần tử cha?","code":null,"choices":["parent.appendChild(child)","parent.addChild(child)","parent.insert(child)","parent.push(child)"],"correctIndex":0,"explanation":"appendChild() gắn phần tử con vào cuối danh sách con của phần tử cha."},{"id":44,"topic":"dom","question":"Đoạn code nào đúng để đổi nội dung văn bản của phần tử el?","code":null,"choices":["el.textContent = 'Xin chào'","el.text = 'Xin chào'","el.content = 'Xin chào'","el.setText('Xin chào')"],"correctIndex":0,"explanation":"Gán el.textContent = '...' để thay đổi nội dung văn bản hiển thị."},{"id":45,"topic":"event","question":"Phương thức nào dùng để đăng ký hàm xử lý khi người dùng click phần tử?","code":null,"choices":["onClick()","addEventListener('click', handler)","attachEvent()","setClick()"],"correctIndex":1,"explanation":"addEventListener('click', handler) là cách chuẩn để lắng nghe sự kiện click."},{"id":46,"topic":"event","question":"event.preventDefault() dùng để làm gì?","code":null,"choices":["Xóa phần tử khỏi DOM","Ngăn hành vi mặc định của trình duyệt","Dừng vòng lặp for","Ẩn phần tử trên trang"],"correctIndex":1,"explanation":"preventDefault() ngăn hành vi mặc định, ví dụ submit form hoặc theo link."},{"id":47,"topic":"event","question":"Đoạn code nào đúng để chạy hàm handleClick khi nút btn được click?","code":null,"choices":["btn.addEventListener('click', handleClick)","btn.on('click', handleClick)","btn.click(handleClick)","btn.addClick(handleClick)"],"correctIndex":0,"explanation":"addEventListener nhận tên sự kiện (chuỗi) và hàm callback."},{"id":48,"topic":"event","question":"Khi nào nên dùng preventDefault() trên form?","code":null,"choices":["Khi muốn form tự reload trang","Khi muốn xử lý submit bằng JavaScript thay vì reload trang","Khi muốn xóa tất cả input","Khi muốn thêm class CSS"],"correctIndex":1,"explanation":"Mặc định form submit sẽ reload trang. preventDefault() giúp xử lý bằng JS."},{"id":49,"topic":"event","question":"Tham số thứ hai của addEventListener là gì?","code":null,"choices":["Tên sự kiện (chuỗi)","Hàm callback được gọi khi sự kiện xảy ra","Phần tử DOM cha","Đối tượng options bắt buộc"],"correctIndex":1,"explanation":"Cú pháp: element.addEventListener(event, callback). Tham số 1 là tên sự kiện."},{"id":50,"topic":"event","question":"Đoạn code nào đúng để ngăn link chuyển trang khi click?","code":null,"choices":["link.addEventListener('click', (e) => e.preventDefault())","link.addEventListener('click', (e) => e.stopPage())","link.preventDefault()","link.addEventListener('prevent', handler)"],"correctIndex":0,"explanation":"Gọi e.preventDefault() trong handler click để ngăn trình duyệt điều hướng theo href."}];

    const form = document.getElementById('quizForm');
    const answeredCountEl = document.getElementById('answeredCount');
    const submitBtn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('statusMsg');
    const resultBox = document.getElementById('result');
    const scoreLine = document.getElementById('scoreLine');
    const scrollMissingBtn = document.getElementById('scrollMissingBtn');

    let submitted = false;

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getAnswers() {
      const answers = {};
      for (const q of questions) {
        const checked = form.querySelector('input[name="q' + q.id + '"]:checked');
        if (checked) answers[q.id] = Number(checked.value);
      }
      return answers;
    }

    function answeredCount() {
      return Object.keys(getAnswers()).length;
    }

    function updateProgress() {
      const n = answeredCount();
      answeredCountEl.textContent = String(n);
      submitBtn.disabled = submitted || n < questions.length;
      if (!submitted && n === questions.length) {
        statusMsg.textContent = 'Đã trả lời hết — có thể nộp bài.';
        statusMsg.style.color = 'var(--ok)';
      } else if (!submitted) {
        statusMsg.textContent = '';
        statusMsg.style.color = '';
      }
    }

    function firstMissing() {
      const answers = getAnswers();
      return questions.find(function (q) { return answers[q.id] === undefined; });
    }

    function render() {
      const letters = ['A', 'B', 'C', 'D'];
      form.innerHTML = questions.map(function (q) {
        const codeBlock = q.code
          ? '<pre class="code"><code>' + escapeHtml(q.code) + '</code></pre>'
          : '';
        const choices = q.choices.map(function (choice, i) {
          return (
            '<li><label>' +
            '<input type="radio" name="q' + q.id + '" value="' + i + '">' +
            '<span><strong>' + letters[i] + '.</strong> ' + escapeHtml(choice) + '</span>' +
            '</label></li>'
          );
        }).join('');
        return (
          '<article class="question" id="question-' + q.id + '" data-id="' + q.id + '">' +
          '<div class="q-meta">' +
          '<span class="q-num">Câu ' + q.id + '</span>' +
          '<span class="badge">' + escapeHtml(TOPIC_LABELS[q.topic] || q.topic) + '</span>' +
          '</div>' +
          '<p class="q-text">' + escapeHtml(q.question) + '</p>' +
          codeBlock +
          '<ul class="choices">' + choices + '</ul>' +
          '<div class="feedback" id="feedback-' + q.id + '"></div>' +
          '</article>'
        );
      }).join('');
    }

    function submitQuiz() {
      if (submitted) return;
      const n = answeredCount();
      if (n < questions.length) {
        const missing = questions.length - n;
        statusMsg.textContent = 'Còn ' + missing + ' câu chưa trả lời. Hãy chọn hết rồi nộp.';
        statusMsg.style.color = 'var(--bad)';
        const first = firstMissing();
        if (first) {
          const el = document.getElementById('question-' + first.id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
        return;
      }

      submitted = true;
      const answers = getAnswers();
      let correct = 0;
      const letters = ['A', 'B', 'C', 'D'];

      for (const q of questions) {
        const article = document.getElementById('question-' + q.id);
        const feedback = document.getElementById('feedback-' + q.id);
        const selected = answers[q.id];
        const isCorrect = selected === q.correctIndex;
        if (isCorrect) correct += 1;

        article.classList.add('submitted', isCorrect ? 'correct' : 'incorrect');
        article.querySelectorAll('input').forEach(function (input) {
          input.disabled = true;
        });

        const correctLabel = letters[q.correctIndex] + '. ' + q.choices[q.correctIndex];
        if (isCorrect) {
          feedback.innerHTML =
            '<div class="verdict ok">Đúng</div>' +
            '<p class="explain">' + escapeHtml(q.explanation) + '</p>';
        } else {
          feedback.innerHTML =
            '<div class="verdict bad">Sai</div>' +
            '<p class="answer"><strong>Đáp án đúng:</strong> ' + escapeHtml(correctLabel) + '</p>' +
            '<p class="explain">' + escapeHtml(q.explanation) + '</p>';
        }
      }

      const pct = Math.round((correct / questions.length) * 100);
      scoreLine.textContent = 'Đúng: ' + correct + '/' + questions.length + ' (' + pct + '%)';
      resultBox.classList.add('visible');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Đã nộp';
      statusMsg.textContent = '';
      resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    form.addEventListener('change', updateProgress);
    submitBtn.addEventListener('click', submitQuiz);
    scrollMissingBtn.addEventListener('click', function () {
      const first = firstMissing();
      if (!first) {
        statusMsg.textContent = 'Không còn câu trống.';
        statusMsg.style.color = 'var(--ok)';
        return;
      }
      const el = document.getElementById('question-' + first.id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    render();
    updateProgress();

    // Dev self-check (console only)
    (function selfCheck() {
      if (questions.length !== 50) console.error('Expected 50 questions, got', questions.length);
      const counts = {};
      questions.forEach(function (q) {
        counts[q.topic] = (counts[q.topic] || 0) + 1;
      });
      Object.keys(EXPECTED_TOPICS).forEach(function (t) {
        if (counts[t] !== EXPECTED_TOPICS[t]) {
          console.error('Topic mismatch', t, counts[t], EXPECTED_TOPICS[t]);
        }
      });
    })();
  </script>
