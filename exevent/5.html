<html>

<head>
    <script>
        const images = ['https://picsum.photos/id/1015/320/160', 'https://picsum.photos/id/1025/320/160', 'https://picsum.photos/id/1035/320/160']

        // khởi tạo ảnh đầu tiên
        document.addEventListener('DOMContentLoaded', (event) => {
            const img = document.getElementById('ev05-img')
            img.src = images[0]
        })

        let index = 0;
        function move(direction) { // giá trị của direction: 'prev' or 'next'
            switch (direction) {
                case 'prev': {
                    if (index === 0) index = images.length - 1;
                    else index--;
                    break;
                }
                case 'next': {
                    if (index === images.length - 1) index = 0;
                    else index++;
                    break;
                }
                default:
                    break;
            }
            const img = document.getElementById('ev05-img');
            img.src = images[index];
            document.getElementById('ev05-out').innerHTML = `Slide ${index + 1} / ${images.length}`
        }
    </script>
</head>

<body>
    <div class="demo">
        <img id="ev05-img" class="slide-img" alt="Slide" width="320" height="160">
        <div>
            <button id="ev05-prev" onclick="move('prev')">Previous</button>
            <button id="ev05-next" onclick="move('next')">Next</button>
        </div>
        <div class="output" id="ev05-out">Slide 1 / 3</div>
    </div>
</body>

</html>
