<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 7 - Toggle Switch</title>
    <style>
        .switch {
            width: 52px;
    height: 28px;
    border-radius: 999px;
    background: #94a3b8;
    position: relative;
    cursor: pointer;
    display: inline-block;
    vertical-align: middle;
    transition: background 0.2s;
        }

        .switch::after {
            content: '';
    position: absolute;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    left: 3px;
    transition: transform 0.2s;
        }

        .switch.on {
            background-color: #4ade80;
        }
        .switch.on::after {
            left: 27px;
        }
    </style>
</head>
<body>

    <div style="display: flex; align-items: center; gap: 10px;">
        <div id="btn-switch" class="switch"></div>
        <span id="text-status">Off</span>
    </div>
    <p id="state-out">State: off</p>

    <script>
        const sw = document.getElementById('btn-switch');
        const textStatus = document.getElementById('text-status');
        const stateOut = document.getElementById('state-out');
        sw.addEventListener('click', () => {
            // Lệnh .classList.toggle('on') sẽ tự động: 
            // Nếu chưa có class "on" -> thêm vào. Nếu có rồi -> xóa đi.
            sw.classList.toggle('on');

            if (sw.classList.contains('on')) {
                textStatus.textContent = "On";
                stateOut.textContent = "State: on";
            } else {
                textStatus.textContent = "Off";
                stateOut.textContent = "State: off";
            }
        });
    </script>

</body>
</html>
